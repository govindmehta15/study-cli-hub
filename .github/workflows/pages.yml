name: Deploy changelog to GitHub Pages

# Publishes docs/index.html's generated sibling (built fresh each run, never
# committed) straight to the github-pages environment via Actions - not by
# committing generated HTML to `main`, since main's branch protection
# (enforce_admins) would reject a workflow push exactly like it rejects a
# manual one. Re-runs automatically every time a release is published, so
# the page can never drift from the actual release history.
on:
  release:
    types: [published]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/build_changelog_page.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install markdown

      - name: Fetch release history and render the page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _site
          gh api "repos/${{ github.repository }}/releases" --paginate \
            | python3 scripts/build_changelog_page.py > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
