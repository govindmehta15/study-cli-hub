[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "study-cli-hub"
version = "5.0.1"
description = "An interactive, slash-command CLI study notebook with GitHub-synced notes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Govind Mehta" }]
keywords = ["cli", "study", "notes", "github", "terminal"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.43",
    "requests>=2.31.0",
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
# Only needed for AI-generated /quiz questions (BYOK - bring your own
# ANTHROPIC_API_KEY). Kept optional so the core install stays lightweight
# for everyone who never uses that one feature.
ai = ["anthropic>=0.40.0"]

[project.urls]
Homepage = "https://github.com/govindmehta15/study-cli-hub"
Repository = "https://github.com/govindmehta15/study-cli-hub"
Issues = "https://github.com/govindmehta15/study-cli-hub/issues"

[project.scripts]
study-hub = "study_cli_hub.cli:main"

[tool.setuptools.packages.find]
include = ["study_cli_hub*"]
